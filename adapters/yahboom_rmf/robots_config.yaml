# Конфигурация флота роботов Yahboom для адаптера Open-RMF
fleet_name: yahboom_fleet

# Габариты и кинематика общие для всех (или можно вынести в каждого робота)
profile:
  footprint: 0.3 # Радиус в метрах (например, для Yahboom MicroROS-Pi5)
  linear_limits:
    v_max: 1.0 # Максимальная линейная скорость (м/с)
    a_max: 2.0 # Максимальное линейное ускорение (м/с^2)
  angular_limits:
    w_max: 0.6 # Максимальная угловая скорость (рад/с)
    alpha_max: 1.5 # Максимальное угловое ускорение (рад/с^2)

# Список роботов в этом флоте
robots:
  yahboom_01:
    start_waypoint: 0
    start_yaw: 0.0
  yahboom_02:
    start_waypoint: 0
    start_yaw: 0.0
