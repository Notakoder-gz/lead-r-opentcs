version: '3.8'

services:
  # OpenTCS Kernel (Core Server)
  opentcs_kernel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opentcs_kernel
    network_mode: "host"
    environment:
      - JAVA_TOOL_OPTIONS=-Duser.language=en -Duser.country=US -Djava.rmi.server.hostname=${HOST_IP}
    volumes:
      - ${OPENTCS_CONFIG_DIR}:/opt/opentcs/config
      - ${OPENTCS_DATA_DIR}:/opt/opentcs/data
    restart: unless-stopped

  # Custom Web Frontend for OpenTCS Monitoring and Orders
  opentcs_web:
    build:
      context: ./opentcs-web
      dockerfile: Dockerfile
    container_name: opentcs_web_frontend
    network_mode: "host"
    environment:
      - PORT=3000
      # Use HOST_IP for connecting to the kernel
      - OPENTCS_URL=http://${HOST_IP}:55200
    restart: unless-stopped

  # VNC container with OpenTCS Client apps (Model Editor & Operations Desk)
  opentcs_client_vnc:
    build:
      context: ./opentcs-client-novnc
      dockerfile: Dockerfile
    container_name: opentcs_vnc
    ports:
      - "8080:8080"
    restart: unless-stopped
